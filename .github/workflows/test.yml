name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # Only on main; pushes to a PR branch are already covered by the pull_request
  # trigger, so restricting this avoids running every job twice per push.
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  # Weekly scan so a vulnerability published between PRs (govulncheck fetches
  # the database at run time) is surfaced without waiting for the next change.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Pinned OS release (ubuntu-latest moves to the next LTS unannounced).
    # Dependabot cannot bump runner labels; move it by hand before GitHub
    # retires the image.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - run: go mod download
      - run: go build -v ./...
      - name: go vet
        run: go vet ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so CI does not pull a floating linter binary. Dependabot cannot
          # track this value; bump it by hand when golangci-lint releases.
          version: v2.15.0

  test:
    name: Unit Tests
    needs: build
    # Pinned OS release (ubuntu-latest moves to the next LTS unannounced).
    # Dependabot cannot bump runner labels; move it by hand before GitHub
    # retires the image.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - run: go mod download
      - run: go test -v -race -cover -timeout=180s ./...

  quality:
    name: Module Quality
    # Pinned OS release (ubuntu-latest moves to the next LTS unannounced).
    # Dependabot cannot bump runner labels; move it by hand before GitHub
    # retires the image.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: govulncheck
        # govulncheck is a `tool` directive in go.mod, so its version is pinned
        # in go.sum and bumped by Dependabot; the vulnerability database is
        # still fetched fresh at run time.
        run: go tool govulncheck ./...

  acceptance:
    # Real Terraform/OpenTofu runs (plan, apply, import, destroy) against the
    # in-memory fake Robot API in internal/provider/acc_fake_test.go. No
    # Hetzner account or secret is involved.
    name: Acceptance (${{ matrix.cli }} ${{ matrix.version }})
    # Pinned OS release (ubuntu-latest moves to the next LTS unannounced).
    # Dependabot cannot bump runner labels; move it by hand before GitHub
    # retires the image.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The release lines each project still patches. The provider adopts
        # only features both CLIs support, so both are tested on every change.
        # Dependabot cannot track these; move them by hand when a new minor
        # ships (newest patch of each line is installed).
        include:
          - { cli: terraform, version: '~1.16.0' }
          - { cli: terraform, version: '~1.17.0' }
          - { cli: tofu, version: '~1.12.0' }
          - { cli: tofu, version: '~1.13.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          # The wrapper script breaks terraform-plugin-testing's output parsing.
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: Acceptance tests
        env:
          TF_ACC: '1'
          # OpenTofu rejects the default (legacy "-") provider namespace.
          TF_ACC_PROVIDER_NAMESPACE: kaltenecker-kg
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v "${{ matrix.cli }}")"
          "$TF_ACC_TERRAFORM_PATH" version
          go test -v -count=1 -timeout=10m -run '^TestAcc' ./internal/provider/
