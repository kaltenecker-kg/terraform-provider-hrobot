# Dependabot version updates. Renovate does not run on this org's public
# repositories, so Dependabot is the single updater. Tool pins that Dependabot
# cannot track natively (tfplugindocs in main.go, golangci-lint in test.yml)
# are bumped by hand; govulncheck is a go.mod `tool` directive so it is
# covered by the gomod ecosystem below.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # Include `// indirect` requirements so security fixes deep in the
    # plugin-framework/grpc stack (like GO-2026-6443) are bumped as well.
    allow:
      - dependency-type: all
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    # The composite action pins setup-go by SHA too.
    directories:
      - /
      - /.github/actions/setup-go
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
