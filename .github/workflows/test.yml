name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # Only on main; pushes to a PR branch are already covered by the pull_request
  # trigger, so restricting this avoids running every job twice per push.
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  # Weekly scan so a vulnerability published between PRs (govulncheck fetches
  # the database at run time) is surfaced without waiting for the next change.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - run: go mod download
      - run: go build -v ./...
      - name: go vet
        run: go vet ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pinned so CI does not pull a floating linter binary. Dependabot cannot
          # track this value; bump it by hand when golangci-lint releases.
          version: v2.14.0

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - run: go mod download
      - run: go test -v -race -cover -timeout=180s ./...

  quality:
    name: Module Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Newest patch of the go.mod minor, asserted against go.dev (see the
      # action for why this is not a plain setup-go step).
      - uses: ./.github/actions/setup-go
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: govulncheck
        # govulncheck is a `tool` directive in go.mod, so its version is pinned
        # in go.sum and bumped by Dependabot; the vulnerability database is
        # still fetched fresh at run time.
        run: go tool govulncheck ./...
